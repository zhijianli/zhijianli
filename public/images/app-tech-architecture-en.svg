  <text class="label-sm" x="120" y="722" text-anchor="middle">Bailian / Volcengine</text>

  <rect class="node" x="195" y="668" width="120" height="36" rx="18"/>
  <text class="node-text" x="255" y="687">LLM</text>
  <text class="label-sm" x="255" y="722" text-anchor="middle">Qwen / Doubao / ChatGPT</text>

  <rect class="node" x="330" y="668" width="120" height="36" rx="18"/>
