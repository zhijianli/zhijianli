  <text class="label-sm" x="390" y="722" text-anchor="middle">Bailian / Volcengine</text>

  <rect class="group" x="40" y="760" width="880" height="180" rx="10"/>
  <text class="box-title" x="56" y="788">Hardware &amp; cloud infrastructure</text>

  <rect class="node" x="64" y="820" width="120" height="36" rx="18"/>
  <text class="node-text" x="124" y="839">ECS</text>
