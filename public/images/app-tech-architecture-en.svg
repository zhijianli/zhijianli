  <text class="label-sm" x="598" y="468" text-anchor="middle">Docker</text>
  <rect class="node" x="528" y="476" width="140" height="36" rx="18"/>
  <text class="node-text" x="598" y="495">Containers</text>

  <text class="label-sm" x="812" y="468" text-anchor="middle">Nginx / MQ / Scheduler</text>
  <rect class="node" x="742" y="476" width="140" height="36" rx="18"/>
  <text class="node-text" x="812" y="495">Middleware</text>

  <path class="line" d="M255 608 V648"/>
  <path class="line-plain" d="M120 648 H390"/>
  <path class="line" d="M120 648 V668"/>
  <path class="line" d="M255 648 V668"/>
  <path class="line" d="M390 648 V668"/>

  <rect class="node" x="60" y="668" width="120" height="36" rx="18"/>
