<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" role="img" aria-labelledby="title desc">
  <title id="title">应用通用技术架构</title>
  <desc id="desc">应用通用技术架构：小程序与后台经 API 网关进入后端服务，再分为 AI 交互层与后端基础设施，下层接 TTS/LLM/ASR，底部为云硬件资源。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8378"/>
    </marker>
    <style>
      .title { font: 600 18px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e8e4dc; }
      .label { font: 12px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7a7570; }
      .label-sm { font: 11px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7a7570; }
      .box-title { font: 600 13px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e8e4dc; }
      .node { fill: #1f1f1f; stroke: #d4754a; stroke-width: 1.25; }
      .node-text { font: 600 13px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e8e4dc; text-anchor: middle; dominant-baseline: middle; }
      .group { fill: #181818; stroke: #3a3a3a; stroke-width: 1; }
      .line { fill: none; stroke: #8a8378; stroke-width: 1.25; marker-end: url(#arrow); }
      .line-plain { fill: none; stroke: #8a8378; stroke-width: 1.25; }
    </style>
  </defs>

  <text class="title" x="24" y="36">应用通用技术架构</text>

  <text class="label" x="250" y="68" text-anchor="middle">原生小程序</text>
  <text class="label" x="710" y="68" text-anchor="middle">React/Vue</text>

  <rect class="node" x="160" y="78" width="180" height="40" rx="20"/>
  <text class="node-text" x="250" y="99">小程序端</text>
  <rect class="node" x="600" y="78" width="220" height="40" rx="20"/>
  <text class="node-text" x="710" y="99">后台管理系统页面</text>

  <path class="line" d="M250 118 V148"/>
  <path class="line" d="M710 118 V148"/>
  <path class="line-plain" d="M250 148 H710"/>
  <path class="line" d="M480 148 V168"/>

  <rect class="node" x="380" y="168" width="200" height="40" rx="20"/>
  <text class="node-text" x="480" y="189">API gateway</text>
  <text class="label-sm" x="600" y="192">JWT / SSL / REST API / WebSocket / SSE</text>

  <path class="line" d="M480 208 V238"/>

  <rect class="node" x="390" y="238" width="180" height="40" rx="20"/>
  <text class="node-text" x="480" y="259">后端服务</text>
  <text class="label-sm" x="590" y="262">Python / Java / TypeScript / Go</text>

  <path class="line" d="M480 278 V308"/>
  <path class="line-plain" d="M255 308 H705"/>
  <path class="line" d="M255 308 V328"/>
  <path class="line" d="M705 308 V328"/>

  <rect class="group" x="40" y="328" width="430" height="280" rx="10"/>
  <text class="box-title" x="56" y="352">AI 交互层</text>

  <text class="label-sm" x="148" y="382" text-anchor="middle">memobase</text>
  <rect class="node" x="78" y="390" width="140" height="36" rx="18"/>
  <text class="node-text" x="148" y="409">个人画像</text>

  <text class="label-sm" x="362" y="382" text-anchor="middle">dify / Mastra / Tools / 知识库 RAG</text>
  <rect class="node" x="292" y="390" width="140" height="36" rx="18"/>
  <text class="node-text" x="362" y="409">Agent</text>

  <text class="label-sm" x="148" y="468" text-anchor="middle">Langfuse</text>
  <rect class="node" x="78" y="476" width="140" height="36" rx="18"/>
  <text class="node-text" x="148" y="495">监控</text>

  <text class="label-sm" x="362" y="458" text-anchor="middle">任务 prompt / SKILLS</text>
  <text class="label-sm" x="362" y="472" text-anchor="middle">个人画像 / 世界书</text>
  <rect class="node" x="292" y="476" width="140" height="36" rx="18"/>
  <text class="node-text" x="362" y="495">context 工程</text>

  <rect class="group" x="490" y="328" width="430" height="280" rx="10"/>
  <text class="box-title" x="506" y="352">后端基础设施</text>

  <text class="label-sm" x="598" y="382" text-anchor="middle">MySQL / PostgreSQL / Redis</text>
  <rect class="node" x="528" y="390" width="140" height="36" rx="18"/>
  <text class="node-text" x="598" y="409">数据存储</text>

  <text class="label-sm" x="812" y="382" text-anchor="middle">Log4j2</text>
  <rect class="node" x="742" y="390" width="140" height="36" rx="18"/>
  <text class="node-text" x="812" y="409">日志监控</text>

  <text class="label-sm" x="598" y="468" text-anchor="middle">Docker</text>
  <rect class="node" x="528" y="476" width="140" height="36" rx="18"/>
  <text class="node-text" x="598" y="495">容器化</text>

  <text class="label-sm" x="812" y="468" text-anchor="middle">Nginx / 消息队列 / 任务调度</text>
  <rect class="node" x="742" y="476" width="140" height="36" rx="18"/>
  <text class="node-text" x="812" y="495">中间件</text>

  <path class="line" d="M255 608 V648"/>
  <path class="line-plain" d="M120 648 H390"/>
  <path class="line" d="M120 648 V668"/>
  <path class="line" d="M255 648 V668"/>
  <path class="line" d="M390 648 V668"/>

  <rect class="node" x="60" y="668" width="120" height="36" rx="18"/>
  <text class="node-text" x="120" y="687">TTS</text>
  <text class="label-sm" x="120" y="722" text-anchor="middle">百炼云 / 火山引擎</text>

  <rect class="node" x="195" y="668" width="120" height="36" rx="18"/>
  <text class="node-text" x="255" y="687">LLM</text>
  <text class="label-sm" x="255" y="722" text-anchor="middle">千问 / 豆包 / ChatGPT</text>

  <rect class="node" x="330" y="668" width="120" height="36" rx="18"/>
  <text class="node-text" x="390" y="687">ASR</text>
  <text class="label-sm" x="390" y="722" text-anchor="middle">百炼云 / 火山引擎</text>

  <rect class="group" x="40" y="760" width="880" height="180" rx="10"/>
  <text class="box-title" x="56" y="788">硬件等基础设施</text>

  <rect class="node" x="64" y="820" width="120" height="36" rx="18"/>
  <text class="node-text" x="124" y="839">ECS 服务器</text>
  <text class="label-sm" x="124" y="874" text-anchor="middle">4核8G · 1/2 台</text>

  <rect class="node" x="204" y="820" width="100" height="36" rx="18"/>
  <text class="node-text" x="254" y="839">RDS</text>

  <rect class="node" x="324" y="820" width="130" height="36" rx="18"/>
  <text class="node-text" x="389" y="839">OSS 对象存储</text>

  <rect class="node" x="474" y="820" width="110" height="36" rx="18"/>
  <text class="node-text" x="529" y="839">SSL 证书</text>

  <rect class="node" x="604" y="820" width="100" height="36" rx="18"/>
  <text class="node-text" x="654" y="839">DNS</text>

  <rect class="node" x="724" y="820" width="100" height="36" rx="18"/>
  <text class="node-text" x="774" y="839">域名</text>
</svg>